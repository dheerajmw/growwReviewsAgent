# Render Blueprint — Phase 8 BFF only (Streamlit is on Streamlit Cloud)
# Dashboard: New → Blueprint → repo growwReviewsAgent, branch main
services:
  - type: web
    name: groww-pulse-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements-bff.txt
    startCommand: uvicorn pipelines.phase8_frontend.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PULSE_DATA_ROOT
        value: /opt/render/project/src/deploy
