# Phase 8 BFF — read-only dashboard API (artifacts under deploy/data on disk)
# Streamlit UI is hosted separately on Streamlit Cloud.
# After push: Render Dashboard → New → Blueprint → growwReviewsAgent
services:
  - type: web
    name: groww-pulse-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-bff.txt
    startCommand: uvicorn pipelines.phase8_frontend.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PULSE_DATA_ROOT
        value: /opt/render/project/src/deploy
      - key: FRONTEND_ORIGIN
        description: Your Streamlit app URL (comma-separated if multiple)
        sync: false
