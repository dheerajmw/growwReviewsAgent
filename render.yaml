# Render Blueprint — BFF API + React UI (Streamlit Cloud embeds the UI)
services:
  - type: web
    name: groww-pulse-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements-bff.txt
    startCommand: python -m uvicorn pipelines.phase8_frontend.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PULSE_DATA_ROOT
        value: /opt/render/project/src/deploy
      - key: FRONTEND_ORIGIN
        value: https://groww-pulse-ui.onrender.com

  - type: web
    name: groww-pulse-ui
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://groww-pulse-api.onrender.com
