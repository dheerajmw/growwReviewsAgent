# Render Blueprint — Phase 8 BFF (Streamlit UI is on Streamlit Cloud)
# Dashboard: New → Blueprint → repo dheerajmw/growwReviewsAgent, branch main
# Root Directory: leave blank (render.yaml must be at repo root)
services:
  - type: web
    name: groww-pulse-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements-bff.txt
    startCommand: python -m uvicorn pipelines.phase8_frontend.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PULSE_DATA_ROOT
        value: /opt/render/project/src/deploy
